services:
  # Backend API Service
  - type: web
    name: expense-tracker-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        sync: false

  # Frontend Static Site
  - type: web
    name: expense-tracker-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend/expense-tracker && npm install && npm run build
    staticPublishPath: ./frontend/expense-tracker/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
